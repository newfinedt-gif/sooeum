<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Academy Finance</title>
  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png?v=3">
  <link rel="stylesheet" href="./styles.css?v=3">
  <style>
    #boot {
      min-height: 100vh; display:flex; align-items:center; justify-content:center;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#334155; padding:24px; text-align:center;
    }
    #boot .box {max-width:420px}
    #boot .title {font-size:22px;font-weight:800;margin-bottom:10px}
    #boot .sub {font-size:14px;line-height:1.6;color:#64748b}
  </style>
</head>
<body>
  <div id="app"><div id="boot"><div class="box"><div class="title">Academy Finance</div><div class="sub">앱을 불러오는 중입니다…</div></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (function () {
      var app = document.getElementById('app');

      function showError(message) {
        app.innerHTML =
          '<div id="boot"><div class="box">' +
          '<div class="title">앱을 불러오지 못했습니다</div>' +
          '<div class="sub">' + message + '<br><br>페이지를 새로고침해 주세요.</div>' +
          '</div></div>';
      }

      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        showError('Supabase 연결 모듈을 불러오지 못했습니다.');
        return;
      }

      var s = document.createElement('script');
      s.src = './app.js?v=3';
      s.onerror = function () {
        showError('app.js 파일을 불러오지 못했습니다.');
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
