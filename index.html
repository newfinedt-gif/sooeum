<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Academy Finance</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=7">
  <style>
    .monthbar{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 14px}.monthbar input{width:auto;min-width:150px;border:1px solid #dbe3ee;border-radius:14px;padding:10px 14px;background:#fff;font:inherit;font-weight:700}.mini{border:0;background:#eef3f8;border-radius:12px;width:42px;height:42px;font-size:24px;cursor:pointer}.txrow{width:100%;border:0;background:transparent;text-align:left;cursor:pointer;padding-left:0!important;padding-right:0!important}.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.chips button{border:1px solid #dbe3ee;background:#f6f8fb;border-radius:999px;padding:8px 13px;cursor:pointer}.danger-lite{width:100%;margin-top:10px;background:#fff0f0!important;color:#d93025!important}.evidence{margin:10px 0 16px;padding:12px;background:#f7f9fc;border-radius:14px}.evidence img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin:9px 0}.action-list{padding-top:4px;padding-bottom:4px}.action{width:100%;border:0;border-bottom:1px solid #edf0f4;background:transparent;text-align:left;padding:17px 2px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit}.action:last-child{border-bottom:0}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.nav-inner{overflow-x:auto}.nav-inner button{min-width:64px}@media(max-width:520px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.nav-inner button{font-size:12px;min-width:58px;padding-left:6px;padding-right:6px}}
  </style>
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;font-family:system-ui,sans-serif;color:#22324a">
      <div><h2 style="margin:0 0 10px">Academy Finance</h2><div style="font-size:14px;color:#54708f">앱을 불러오는 중입니다…</div></div>
    </div>
  </div>
  <script src="./app.js?v=8"></script>
  <script>
    setTimeout(function(){var a=document.getElementById('app');if(a&&a.textContent.indexOf('앱을 불러오는 중')>=0){a.innerHTML='<div style="max-width:520px;margin:120px auto;padding:24px;font-family:system-ui,sans-serif"><h2>앱 실행을 확인해주세요</h2><p>app.js v8이 실행되지 않았습니다. 페이지를 새로고침해주세요.</p></div>'}},5000);
    if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js?v=8').catch(console.error)})}
  </script>
</body>
</html>
